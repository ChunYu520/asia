name = "bilibili-proxy"
type = "javascript-api"

#  Workers 兼容版本（ES Modules）
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 路由：绑定到你的域名（可选，不填则使用 *.workers.dev 默认域名）
# routes = [
#   { pattern = "bili.yuki-can.asia/bili*", zone_name = "yuki-can.asia" },
# ]

# 环境变量（可选，填写后可在 Worker 代码中通过 env.KEY 访问）
[vars]
# BILI_SESSDATA = ""
# BILI_BILI_JCT = ""

# KV 命名空间（如果需要持久化统计，可选）
# [[kv_namespaces]]
# binding = "BILI_CACHE"
# id = ""

# 观察模式（开发时用）
[miniflare]
watch = true
